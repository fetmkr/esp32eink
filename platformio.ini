[env]
platform = espressif32
board = seeed_xiao_esp32_s3_plus
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; 평소 쓰는 것. 흑백, 시계, 버튼.
[env:xiao_ee05]
build_src_filter = +<*> -<gray/>
lib_deps =
	zinggjm/GxEPD2@^1.6.4
	adafruit/Adafruit GFX Library@^1.11.11

; 회색 4단계 시험 화면. 라이브러리 클래스 이름이 겹쳐서 환경을 나눴다.
[env:gray4]
build_src_filter = +<kfont.cpp> +<gray/>
lib_deps =
	https://github.com/ZinggJM/GxEPD2_4G.git
	adafruit/Adafruit GFX Library@^1.11.11
